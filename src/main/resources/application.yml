server:
  port: 8123
  servlet:
    context-path: /api
    multipart:
      max-file-size: 10MB
      session:
        timeout: 2592000
        store-type: redis
        cookie:
          http-only: true # 防止前端 JS 读取 Session Cookie，增强安全性
          max-age: 2592000
spring:
  application:
    name: qy-picture-backend
  profiles:
    active: local
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qy-picture
    username: root
    password: roots
    # Redis 配置
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
knife4j:
  enable: true
  openapi:
    title: QY图库平台官方文档
    version: v4.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - hunan.qianyuan.qypictureback.controller





